    Computational Methods and Technical Expertise:
      - bullet: '**Small-angle neutron-scattering simulation and data analysis.** Main developer of [NuMagSANS](https://github.com/AdamsMP92/NuMagSANS), a GPU-accelerated simulator for generic nuclear and magnetic SANS observables of complex systems. Developer of the MATLAB-based [MuMag2022](https://doi.org/10.1107/S1600576722005349) fitting software for experimental SANS data from bulk magnets.'
      - bullet: '**Micromagnetics and atomistic spin dynamics.** Continuum modelling with MuMax3, OOMMF, and Ubermag, including pore-induced spin disorder, vortex textures, the Dzyaloshinskii-Moriya interaction, and reduced models of vortex nucleation and reversal. Development of atomistic spin-dynamics software for spherical nanoparticles with surface and magnetocrystalline anisotropy.'
      - bullet: '**Neutron-scattering experiments.** Participation in two beamtimes at the [Institut Laue-Langevin](https://www.ill.eu/) and one at the [ISIS Neutron and Muon Source](https://www.isis.stfc.ac.uk/), with a primarily theoretical role in data reduction, MuMag2022-based analysis, micromagnetic modelling, and physical interpretation.'

    Research Funding:
      - bullet: '**FNR AFR Individual PhD Grant No. 15639149**, with Prof. Andreas Michels, *Magnetic neutron scattering of nanoparticles: analytical theory and experiment beyond the superspin model* (2021). Funding covered one four-year PhD position and €6,000 for travel.'

